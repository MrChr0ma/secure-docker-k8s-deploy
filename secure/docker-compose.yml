# docker-compose durci - TP final
# Les secrets viennent du fichier .env (voir .env.example), jamais du depot.

services:
  nginx-proxy:
    image: nginx:1.28-alpine            # version fixee (plus de :latest)
    container_name: tp-nginx
    restart: unless-stopped
    ports:
      - "8080:80"                       # seul point d'entree publie
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:                            # strict minimum pour nginx
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      web-app:
        condition: service_healthy

  web-app:
    image: tp-app-web:alpine            # ATTENTION: image a auditer/reconstruire (voir rapport 4.1)
    container_name: tp-app-web
    restart: unless-stopped
    # plus de "privileged" ni de port 8000 publie : accessible uniquement via nginx
    expose:
      - "8000"
    networks:
      - frontend
      - backend
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.50"                        # borne aussi le faux mineur
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-bookworm         # version fixee
    container_name: tp-db
    restart: unless-stopped
    # plus de port 5432 publie : la base n'est joignable que par web-app
    networks:
      - backend
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    cap_add:                            # requis par l'entrypoint postgres
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    cpus: "1.00"
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true                      # pas d'acces Internet ni depuis l'exterieur

volumes:
  postgres-data:
